{% extends "admin/base.html" %}
{% block title %}Edit Ticket Class{% endblock %}
{% block content %}
<h2 style="margin-bottom:16px">Edit Ticket Class</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Match</label>
  <select name="match_id">
    {% for m in matches %}
    <option value="{{ m.id }}" {% if tc.match_id==m.id %}selected{% endif %}>{{ m.display_name }}</option>
    {% endfor %}
  </select>
  <label>Name</label>
  <input name="name" value="{{ tc.name }}" required>
  <label>Price</label>
  <input name="price" type="number" step="0.01" value="{{ tc.price }}" required>
  <label>Total seats</label>
  <input name="total_seats" type="number" value="{{ tc.total_seats }}">
  <label>Gate</label>
  <input name="gate" value="{{ tc.gate }}">
  <label>Zone</label>
  <input name="zone" value="{{ tc.zone }}">
  <label>Sort order</label>
  <input name="sort_order" type="number" value="{{ tc.sort_order }}">
  <label><input type="checkbox" name="is_active" value="1" {% if tc.is_active %}checked{% endif %}> Active</label>
  <div style="margin-top:12px">
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-outline" href="{{ url_for('admin.classes') }}">Back</a>
  </div>
</form>
{% endblock %}
