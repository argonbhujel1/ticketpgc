<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>Register Gate Staff</title>
  <style>
    :root { --gold:#c9a227; --bg:#070b14; --card:#0d1526; --muted:#8b93a7; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100dvh; font-family:system-ui,-apple-system,sans-serif;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,162,39,0.12), transparent 50%), var(--bg);
      color:#f0f2f5; display:flex; align-items:center; justify-content:center;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      width:100%; max-width:420px; background:var(--card); border:1px solid rgba(201,162,39,0.35);
      border-radius:18px; padding:28px 22px;
    }
    h1 { margin:0 0 6px; color:var(--gold); font-size:1.2rem; text-align:center; }
    .sub { text-align:center; color:var(--muted); font-size:0.85rem; margin:0 0 20px; line-height:1.5; }
    label { display:block; font-size:0.8rem; color:var(--muted); margin:14px 0 6px; line-height:1.4; }
    label b { color:#e8ecf4; font-weight:600; }
    input {
      width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:#0a101c;
      color:#fff; font-size:16px;
    }
    input:focus { outline:none; border-color:var(--gold); }
    button {
      width:100%; margin-top:20px; padding:14px; border:none; border-radius:999px;
      background:var(--gold); color:#111; font-weight:800; font-size:1rem; cursor:pointer;
    }
    .links { text-align:center; margin-top:16px; font-size:0.85rem; }
    .links a { color:var(--gold); text-decoration:none; margin:0 8px; }
    .flash { background:rgba(229,57,53,0.2); border:1px solid #e53935; padding:10px 12px; border-radius:10px; margin-bottom:12px; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gate Staff Registration</h1>
    <p class="sub">गेट स्टाफ दर्ता · Admin login पछि नयाँ स्टाफ बनाउनुहोस्</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label>
        <b>Please enter your display name</b><br>
        कृपया आफ्नो प्रदर्शन नाम लेख्नुहोस्<br>
        <span style="font-size:0.75rem">(scan / mail मा देखिने नाम)</span>
      </label>
      <input name="display_name" required maxlength="80" placeholder="e.g. Argan" autocomplete="nickname">

      <label>
        <b>Enter your documented name</b><br>
        आफ्नो आधिकारिक / कागजातको नाम लेख्नुहोस्
      </label>
      <input name="documented_name" required maxlength="120" placeholder="e.g. Argan Bhujel" autocomplete="name">

      <label>
        <b>Enter your valid email ID</b><br>
        आफ्नो सही इमेल ठेगाना लेख्नुहोस्<br>
        <span style="font-size:0.75rem">(username / password यसैमा पठाइन्छ)</span>
      </label>
      <input type="email" name="email" required maxlength="120" placeholder="name@gmail.com" autocomplete="email">

      <button type="submit">Create staff account · खाता बनाउनुहोस्</button>
    </form>
    <div class="links">
      <a href="{{ url_for('gate.index') }}">Open scanner</a>
      <a href="{{ url_for('gate.logout') }}">Logout</a>
    </div>
  </div>
</body>
</html>
