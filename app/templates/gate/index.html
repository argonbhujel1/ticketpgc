<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PGC Gate">
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-180.png') }}">
  <title>PGC Gate Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --gold: #c9a227;
      --gold-light: #ffd56a;
      --bg: #070b14;
      --card: #0d1526;
      --muted: #8b93a7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(201,162,39,0.14), transparent 50%),
        var(--bg);
      color: #f0f2f5;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }
    .gate-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .gate-header img {
      width: 56px; height: 56px; border-radius: 50%;
      object-fit: contain; background: #fff;
      border: 2px solid var(--gold);
    }
    h1 {
      color: var(--gold);
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      margin: 0;
      font-weight: 800;
    }
    .user-line {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 12px;
    }
    .user-line a { color: var(--gold); font-weight: 600; text-decoration: none; }
    .stats {
      display: flex;
      gap: 10px;
      margin: 8px 0 16px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }
    .stats div {
      flex: 1;
      min-width: 100px;
      background: var(--card);
      border: 1px solid rgba(201,162,39,0.3);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }
    .stats strong { display: block; font-size: 1.5rem; color: var(--gold-light); }
    .stats .rej strong { color: #e57373; }
    .stats .ok strong { color: #81c784; }
    .stats span { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: 0.04em; }

    .scan-status {
      width: min(360px, 100%);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 8px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
      background: rgba(201,162,39,0.12);
      border: 1px solid rgba(201,162,39,0.35);
      color: var(--gold-light);
    }
    .scan-status.busy {
      background: rgba(255,167,38,0.15);
      border-color: #ffa726;
      color: #ffcc80;
    }
    .scan-status.paused {
      background: rgba(46,125,50,0.2);
      border-color: #2e7d32;
      color: #a5d6a7;
    }

    #reader {
      width: min(360px, 100%);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--gold);
      background: #111;
      min-height: 220px;
      position: relative;
    }
    #reader.dimmed::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 2;
      pointer-events: none;
    }
    .manual {
      margin-top: 16px;
      width: min(360px, 100%);
      text-align: center;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: var(--card);
      color: #fff;
      font-size: 16px;
      text-align: center;
      min-height: 50px;
    }
    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,162,39,0.2);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-height: 50px;
      padding: 12px 18px;
      border: none;
      border-radius: 999px;
      background: var(--gold);
      color: #111;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.95rem;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
    }
    #result {
      margin-top: 16px;
      padding: 20px 16px;
      border-radius: 16px;
      width: min(360px, 100%);
      text-align: center;
      display: none;
    }
    #result.ok { background: rgba(46,125,50,0.25); border: 2px solid #2e7d32; display: block; }
    #result.bad { background: rgba(229,57,53,0.2); border: 2px solid #e53935; display: block; }
    #result.used { background: rgba(255,167,38,0.2); border: 2px solid #ffa726; display: block; }
    .hint { color: #666; font-size: 0.8rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="gate-header">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="PGC" width="56" height="56">
    <h1>GATE SCANNER</h1>
  </div>
  <p class="user-line">
    {{ current_user.username }} · <a href="{{ url_for('gate.logout') }}">Logout</a>
  </p>

  <div class="stats">
    <div class="ok"><strong id="entered">{{ entered }}</strong><span>Entered</span></div>
    <div class="rej"><strong id="rejected">{{ rejected }}</strong><span>Rejected</span></div>
  </div>

  <div id="scanStatus" class="scan-status">Ready to scan</div>
  <div id="reader"></div>

  <div class="manual">
    <input id="code" type="text" inputmode="text" autocomplete="off" placeholder="Or type ticket code">
    <div class="btn-row">
      <button type="button" id="btnManual" onclick="scanManual()">Check code</button>
      <button type="button" class="secondary" id="btnCam" onclick="toggleCam()">Stop camera</button>
    </div>
    <p class="hint">One ticket at a time · camera pauses after each scan</p>
  </div>

  <div id="result"></div>

  <script>
  const CHECK_URL = "{{ url_for('gate.check') }}";
  const COOLDOWN_MS = 4500;      // block same/any code while showing result
  const SAME_CODE_MS = 12000;    // same QR ignored longer

  let html5QrCode = null;
  let camOn = false;
  let scanning = false;          // request in flight
  let paused = false;            // after a scan, wait before next
  let lastCode = '';
  let lastAt = 0;
  let resumeTimer = null;

  function setStatus(text, mode) {
    const el = document.getElementById('scanStatus');
    el.textContent = text;
    el.className = 'scan-status' + (mode ? ' ' + mode : '');
  }

  function setReaderDim(on) {
    document.getElementById('reader').classList.toggle('dimmed', !!on);
  }

  async function pauseCamera() {
    if (!html5QrCode || !camOn) return;
    try {
      await html5QrCode.pause(true); // pause and keep camera on
      paused = true;
      setReaderDim(true);
    } catch (e) {
      // pause may fail on some devices — rely on scanning lock
      paused = true;
      setReaderDim(true);
    }
  }

  async function resumeCamera() {
    if (resumeTimer) {
      clearTimeout(resumeTimer);
      resumeTimer = null;
    }
    paused = false;
    scanning = false;
    setReaderDim(false);
    setStatus('Ready to scan');
    if (html5QrCode && camOn) {
      try {
        await html5QrCode.resume();
      } catch (e) {}
    }
  }

  function scheduleResume(ms) {
    if (resumeTimer) clearTimeout(resumeTimer);
    const sec = Math.ceil(ms / 1000);
    setStatus('Next scan in ' + sec + 's…', 'paused');
    let left = sec;
    resumeTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(resumeTimer);
        resumeTimer = null;
        resumeCamera();
      } else {
        setStatus('Next scan in ' + left + 's…', 'paused');
      }
    }, 1000);
  }

  async function processCode(raw, fromCamera) {
    let code = (raw || '').trim();
    if (!code) return;

    // Extract ticket code if QR embeds a URL
    try {
      if (code.indexOf('http') === 0) {
        const u = new URL(code);
        code = u.searchParams.get('code') || u.pathname.split('/').pop() || code;
      }
    } catch (e) {}
    code = code.toUpperCase();

    const now = Date.now();
    if (scanning || paused) return;
    if (code === lastCode && (now - lastAt) < SAME_CODE_MS) return;
    if ((now - lastAt) < 800) return; // hard debounce

    scanning = true;
    lastCode = code;
    lastAt = now;
    setStatus('Checking…', 'busy');

    if (fromCamera) {
      await pauseCamera();
    }

    try {
      const r = await fetch(CHECK_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code})
      });
      const d = await r.json();
      if (d.entered != null) document.getElementById('entered').textContent = d.entered;
      if (d.rejected != null) document.getElementById('rejected').textContent = d.rejected;

      const el = document.getElementById('result');
      el.className = d.ok ? 'ok' : (d.status === 'used' ? 'used' : 'bad');
      el.style.display = 'block';
      el.innerHTML =
        '<div style="font-size:1.35rem;font-weight:900">' + (d.message || d.status) + '</div>' +
        '<div style="margin-top:8px">' + (d.code || '') + '</div>' +
        '<div>' + (d.holder || '') + '</div>' +
        '<div style="color:#aaa;font-size:0.9rem">' +
          (d.match || '') + (d.class ? ' · ' + d.class : '') +
        '</div>';

      if (navigator.vibrate) {
        navigator.vibrate(d.ok ? [50] : [90, 50, 90]);
      }

      // Keep result visible, then auto-ready for next ticket
      scheduleResume(COOLDOWN_MS);
    } catch (e) {
      setStatus('Network error', 'busy');
      alert('Network error: ' + e);
      scanning = false;
      scheduleResume(2000);
    }
  }

  function scanManual() {
    const input = document.getElementById('code');
    processCode(input.value, false);
    input.value = '';
    input.blur();
  }

  document.getElementById('code').addEventListener('keydown', e => {
    if (e.key === 'Enter') scanManual();
  });

  function onScanSuccess(decodedText) {
    // html5-qrcode fires very often — only process when idle
    if (scanning || paused) return;
    processCode(decodedText, true);
  }

  async function startCam() {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode('reader');
    }
    try {
      await html5QrCode.start(
        { facingMode: 'environment' },
        {
          fps: 5,
          qrbox: { width: 240, height: 240 },
          // reduce continuous decode spam
          disableFlip: false,
        },
        onScanSuccess,
        () => {}
      );
      camOn = true;
      paused = false;
      document.getElementById('btnCam').textContent = 'Stop camera';
      setStatus('Ready to scan');
      setReaderDim(false);
    } catch (err) {
      document.getElementById('reader').innerHTML =
        '<p style="padding:24px;color:#888;text-align:center">Camera not available.<br>Use manual code entry.</p>';
      document.getElementById('btnCam').style.display = 'none';
      setStatus('Manual mode');
    }
  }

  async function toggleCam() {
    if (!html5QrCode) return;
    if (camOn) {
      if (resumeTimer) {
        clearInterval(resumeTimer);
        resumeTimer = null;
      }
      try {
        if (paused) {
          try { await html5QrCode.resume(); } catch (e) {}
        }
        await html5QrCode.stop();
      } catch (e) {}
      camOn = false;
      paused = false;
      scanning = false;
      setReaderDim(false);
      document.getElementById('btnCam').textContent = 'Start camera';
      setStatus('Camera off');
    } else {
      await startCam();
    }
  }

  startCam();
  </script>
</body>
</html>
